<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 Practice 4</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

    <style>
                body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            position: relative;
            overflow-x: hidden;
            color: #ffeeb7;
        }
        
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background-size: cover;
            background-position: center;
            animation: slide 12s ease-in-out infinite;
            filter: blur(6px) brightness(1);
            transform: scale(1.1) rotate(-2deg);
        }
        
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255, 217, 78, 0.201);
            z-index: -1;
        }
        
        @keyframes slide {
            0% {
                background-image: url("https://i.pinimg.com/1200x/c1/58/ca/c158cabb40de51b5ca5b8ea219f6b4a3.jpg");
            }
            40% {
                background-image: url("https://i.pinimg.com/736x/76/94/51/769451b9f0470e2a8b0a662981c66aab.jpg");
            }
            80% {
                background-image: url("https://i.pinimg.com/1200x/5c/5e/ec/5c5eecea16df453e6c2198ef1840e088.jpg");
            }
            100% {
                background-image: url("https://i.pinimg.com/736x/8f/9d/e4/8f9de4a984b745d748dc90ac554bce91.jpg");
            }
        }


        .main-box {
            background: rgba(255, 223, 120, 0.12);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 45px 35px;
            width: 360px;
            margin: auto;
            margin-top: 70px;
            border: 1px solid rgba(255, 223, 120, 0.4);

            animation: glowPulse 3s ease-in-out infinite;
        }


        @keyframes glowPulse {
            0% {
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.3),
                            0 0 40px rgba(255, 215, 0, 0.2);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 223, 120, 0.7),
                            0 0 80px rgba(255, 215, 0, 0.5);
            }
            100% {
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.3),
                            0 0 40px rgba(255, 215, 0, 0.2);
            }
        }
    </style>
</head>

<body>

    <form>
        <h2>Login Form</h2>

        <label for="uname">Username</label><br>
        <input type="text" id="uname" class="form-control" placeholder="Enter here" required>
        <br>

        <label for="pwd">Password</label><br>
        <input type="password" id="pwd" class="form-control" placeholder="Enter here" required>
        <br>

        <p id="display" class="text-danger"></p>
        
        <input type="button" id="loginBTN" value="Login" class="btn btn-info rounded-5" onclick="authenticate()">
    </form>

    <script>
        let attempt_counter = 0;

        function authenticate() {
            let username = document.getElementById("uname").value;
            let pwd = document.getElementById("pwd").value;

            if (username === "hearty_pink" && pwd === "heartspinks") {
                alert("Welcome " + username + "!");
                attempt_counter = 0;
                document.getElementById("display").innerHTML = "";
                window.location.href = "index.html";
            } 
            else {
                attempt_counter++;

                if (attempt_counter >= 3) {
                    document.getElementById("display").innerHTML =
                        "Access denied. Account locked after 3 attempts!";
                    document.getElementById("loginBTN").disabled = true;
                } 
                else {
                    document.getElementById("display").innerHTML =
                        "Incorrect username/password. Attempt " + attempt_counter + " of 3";
                }
            }
        }
    </script>

</body>
</html>
